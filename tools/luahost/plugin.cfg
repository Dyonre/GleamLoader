# LuaHost settings (key = value). The plugin itself only runs when "LuaHost" is listed in Mods\plugins.txt.
# budget: Lua instructions one event handler / timer / REPL line may run (default 2000000; a script's top level gets 5x).
budget = 2000000
# memory_mb: memory cap of all scripts together (default 64).
memory_mb = 64
# reload: on = script files are polled every second; a change reloads every script.
reload = on
# repl: on = Lua written into repl_in.txt (this folder) runs within a second; results go to repl_out.txt and the log.
repl = on
